function renderDsPickerItem(ds, player, playerKey) {
  const sizing = squadSizing(ds);
  const remaining = remainingCount(ds);
  const hasLimit = BOX_LIMITS[ds.name] !== undefined;
  const minViable = sizing.adjustable ? (sizing.fixedTotal + 1) : sizing.defaultTotal;
  const exhausted = remaining < minViable;

  const item = el("div", { class: "ds-item" });
  item.style.flexWrap = "wrap";
  const sizeLabel = ds.profiles.length > 1
    ? ds.profiles.map(p => p.label + " x" + p.count).join(" + ")
    : "x" + sizing.defaultTotal;
  const availabilityText = hasLimit ? (!exhausted ? ", " + remaining + " disponível(eis) na caixa" : ", esgotado na caixa") : "";
  const nameRow = el("div", { class: "ds-name-row" });
  nameRow.appendChild(renderUnitPhoto(ds));
  const nameSpan = el("span", { text: ds.name + " (" + sizeLabel + availabilityText + ")" });
  if (exhausted) nameSpan.style.color = "var(--text-sec)";
  nameRow.appendChild(nameSpan);
  item.appendChild(nameRow);

  if (exhausted) {
    item.appendChild(el("span", { text: "Esgotado", class: "faction-badge", style: "font-size:11px;" }));
    return item;
  }

  const eligibleLeaders = leadersFor(ds);
  const eligibleSupports = supportersFor(ds);
  let leaderName = "";
  let supportName = "";
  let count = Math.min(sizing.defaultTotal, remaining);

  if (eligibleLeaders.length > 0) {
    const leaderSelect = el("select");
    leaderSelect.style.width = "auto";
    leaderSelect.appendChild(el("option", { value: "", text: "Sem líder" }));
    eligibleLeaders.forEach(l => leaderSelect.appendChild(el("option", { value: l.name, text: "+ " + l.name })));
    leaderSelect.onchange = e => { leaderName = e.target.value; };
    item.appendChild(leaderSelect);
  }

  if (eligibleSupports.length > 0) {
    const supportSelect = el("select");
    supportSelect.style.width = "auto";
    supportSelect.appendChild(el("option", { value: "", text: "Sem suporte" }));
    eligibleSupports.forEach(l => supportSelect.appendChild(el("option", { value: l.name, text: "+ " + l.name + " (suporte)" })));
    supportSelect.onchange = e => { supportName = e.target.value; };
    item.appendChild(supportSelect);
  }

  if (sizing.adjustable) {
    const minCount = sizing.fixedTotal + 1;
    const countInput = el("input", { type: "number" });
    countInput.style.width = "56px";
    countInput.value = count;
    countInput.min = String(minCount);
    countInput.max = String(remaining);
    countInput.oninput = e => { count = Math.max(minCount, Math.min(remaining, parseInt(e.target.value) || minCount)); };
    item.appendChild(countInput);
  }

  const addBtn = el("button", { class: "small primary", text: "Adicionar" });
  addBtn.onclick = () => {
    const leaderDs = leaderName ? findDatasheet(library, leaderName) : null;
    const supportDs = supportName ? findDatasheet(library, supportName) : null;
    addUnitToPlayer(playerKey, ds, { leaderDs, supportDs, count: sizing.adjustable ? count : null });
    render();
  };
  item.appendChild(addBtn);

  return item;
}

// ---------------------------------------------------------------------------
// SHOOTING PHASE — ciclo de ataque (steps 1-11 do prompt)
// ---------------------------------------------------------------------------
function allInstances() {
  const a = state.setup.playerA.units.map(u => Object.assign({}, u, { owner: "A", ownerName: state.setup.playerA.name || "Jogador A" }));
  const b = state.setup.playerB.units.map(u => Object.assign({}, u, { owner: "B", ownerName: state.setup.playerB.name || "Jogador B" }));
  return a.concat(b);
}
function findInstance(id) { return allInstances().find(u => String(u.id) === String(id)); }

function renderAttackCycle(phaseKey) {
  const wrap = el("div");
  const c = state.cycle;
  const instances = allInstances();
  const hitStat = phaseKey === "fight" ? "WS" : "BS";
  const weaponLabel = phaseKey === "fight" ? "arma (combate)" : "arma (tiro)";

  wrap.appendChild(renderStratagemsCard(phaseKey));
  if (phaseKey === "fight") wrap.appendChild(renderFightSequenceCard());

  if (instances.length === 0 && c.step === 0) {
    wrap.appendChild(el("div", { class: "empty", text: 'Ainda não há unidades configuradas. Vai ao separador "Setup" e adiciona unidades aos dois jogadores primeiro.' }));
  }

  if (c.step === 0) {
    wrap.appendChild(renderPicker(instances, phaseKey));
    return wrap;
  }

  const attacker = findInstance(c.attackerId);
  const attackerWeapons = attacker ? weaponsForPhase(attacker, phaseKey) : [];
  const weapon = attacker && c.weaponIdx !== "" ? attackerWeapons[c.weaponIdx] : null;
  const target = findInstance(c.targetId);
  if (!attacker || !weapon || !target) { c.step = 0; return renderAttackCycle(phaseKey); }
  // Nome a mostrar na badge "quem rola" de cada passo — sempre o jogador
  // dono da unidade + a unidade em si, para nunca haver dúvida.
  const attackerRollerName = attacker.ownerName + " (" + attacker.label + ")";
  const defenderRollerName = target.ownerName + " (" + target.label + ")";

  const banner = el("div", { class: "card" });
  banner.style.cssText = "background:var(--surface2);font-size:12px;";
  banner.appendChild(document.createTextNode(""));
  const b1 = el("b", { text: attacker.label });
  banner.appendChild(b1);
  banner.appendChild(document.createTextNode(" (" + weapon.name + ") atinge "));
  banner.appendChild(el("b", { text: target.label }));
  const resetBtn = el("button", { class: "small", text: "reiniciar" });
  resetBtn.style.float = "right";
  resetBtn.onclick = () => { state.cycle = emptyCycle(); render(); };
  banner.appendChild(resetBtn);
  weaponKeywordNotes(weapon).forEach(n => {
    banner.appendChild(el("div", { text: "ℹ️ [" + n.keyword + "] " + n.text, style: "font-size:11px;color:var(--text-sec);margin-top:6px;clear:both;" }));
  });
  wrap.appendChild(banner);

  const isTorrent = phaseKey === "shooting" && hasKeyword(weapon, "TORRENT");
  const isDevWounds = hasKeyword(weapon, "DEVASTATING WOUNDS");
  const sustainedX = !isTorrent && hasKeyword(weapon, "SUSTAINED HITS") ? keywordValue(weapon, "SUSTAINED HITS") : null;
  // HEAVY: +1 ao hit roll se a unidade não se moveu mais de 3" este turno —
  // condição física respondida pelo jogador antes do passo de hits.
  const isHeavy = !isTorrent && hasKeyword(weapon, "HEAVY");
  const heavyBonus = (isHeavy && c.heavyStationary === true) ? 1 : 0;
  // Lethal Hits condicional a ter carregado este turno (ability de
  // unidade, ex: Vanguard Assault) — só relevante em combate corpo a corpo.
  const chargeLethalHitsText = chargeLethalHitsAbility(weapon, phaseKey);
  const lethalHitsActive = !!chargeLethalHitsText && c.chargedThisTurn === true;
  // ANTI-X Y+: se o alvo tiver a keyword X (confirmado automaticamente via
  // datasheet, nunca perguntado — não depende de nada físico na mesa),
  // qualquer wound roll ≥ Y é sempre critical wound, mesmo abaixo do
  // threshold normal de ferir. Por isso baixa o threshold efetivo de ferir
  // e (se relevante) o threshold de "o que conta como crítico".
  const antiInfo = parseAntiKeyword(weapon);
  const antiApplies = !!(antiInfo && targetHasUnitKeyword(target, antiInfo.targetKeyword));
  const critThreshold = antiApplies ? Math.min(6, antiInfo.threshold) : 6;
  const hitThreshold = parseThreshold(toHitValue(weapon, phaseKey));
  const effHitThreshold = adjustedThreshold(hitThreshold, c.hitAdjust + heavyBonus);
  const targetT = target.groups[0].stats.T;
  const rawWoundT = woundThreshold(weapon.S, targetT);
  const woundT = antiApplies ? Math.min(rawWoundT, antiInfo.threshold) : rawWoundT;
  const effWoundThreshold = adjustedThreshold(woundT, c.woundAdjust);

  function effSaveFor(group) {
    const sv = parseThreshold(group.stats.SV);
    const inv = parseThreshold(group.stats.InvSV);
    const ap = Math.abs(weapon.AP || 0);
    let eff = sv + ap;
    if (inv !== null && inv < eff) eff = inv;
    return eff;
  }
  const liveGroups = target.groups.filter(g => g.liveCount > 0);
  const defaultSaveGroup = liveGroups[0] || target.groups[0];
  const saveThreshold = effSaveFor(defaultSaveGroup);
  const dmgInfo = parseDamage(weapon.D);
  const attackIsFixed = typeof weapon.A === "number";
  const attacksBonus = computeAttacksBonus(weapon, c);
  const meltaBonus = computeDamageBonus(weapon, c);
  const attacksMax = maxOfDiceNotation(weapon.A);

  // RAPID FIRE/CLEAVE/BLAST com Attacks variável (ex: D3) precisam de saber
  // o valor base fisicamente rolado antes de somar o bónus (com A fixo o
  // bónus soma-se direto ao número, sem perguntar nada de novo).
  const needsAttacksRollStep = !attackIsFixed && attacksBonus !== 0;

  if (c.step === 1) {
    if (needsAttacksRollStep && c.attacksRolled === null) {
      wrap.appendChild(renderNumberStep({
        title: "Attacks desta arma (base " + weapon.A + "): quanto rolaste?",
        hint: "Depois soma-se o bónus de +" + attacksBonus + " attacks (" + attacksBonusLabel(weapon, c) + ") antes de perguntar os hits.",
        threshold: null, stepKey: "attacksroll", max: attacksMax, countLabel: "Attacks rolados (base)",
        roller: "attacker", rollerName: attackerRollerName, rollWhy: "Roll de Attacks — decide quantos ataques esta arma faz neste ataque.",
        onConfirm: n => { c.attacksRolled = n; render(); },
        confirmLabel: "Confirmar attacks →",
      }));
      return wrap;
    }

    // HEAVY: pergunta a condição física (não moveu mais de 3") antes do
    // passo de hits, com um aviso bem visível — a app nunca decide sozinha
    // se a unidade se moveu, só aplica o +1 ao acertar depois de confirmado.
    if (isHeavy && c.heavyStationary === null) {
      const card = el("div", { class: "card" });
      card.appendChild(renderRollerBadge("attacker", attackerRollerName, "Condição de HEAVY — confirma antes de rolar os hits."));
      card.appendChild(el("div", { class: "step-hint", text: "⚠️ " + weapon.name + " tem HEAVY: +1 ao acertar se a unidade não se moveu mais de 3\" este turno.", style: "color:var(--gold);font-weight:600;font-size:13px;" }));
      card.appendChild(el("h3", { text: "Esta unidade não se moveu mais de 3\" este turno?" }));
      const sel = el("select");
      [["", "— escolher —"], ["yes", "Sim"], ["no", "Não"]].forEach(([v, t]) => {
        const o = el("option", { value: v, text: t });
        sel.appendChild(o);
      });
      sel.onchange = e => { c.heavyStationary = e.target.value === "" ? null : e.target.value === "yes"; render(); };
      card.appendChild(sel);
      wrap.appendChild(card);
      return wrap;
    }

    // Lethal Hits condicional a ter carregado este turno (ex: Vanguard
    // Assault) — pergunta antes do passo de hits, já que muda o que os 6
    // não modificados vão fazer no passo seguinte.
    if (chargeLethalHitsText && c.chargedThisTurn === null) {
      const card = el("div", { class: "card" });
      card.appendChild(renderRollerBadge("attacker", attackerRollerName, "Condição de Lethal Hits — confirma antes de rolar os hits."));
      card.appendChild(el("div", { class: "step-hint", text: "⚔️ " + chargeLethalHitsText, style: "color:var(--gold);font-weight:600;font-size:13px;" }));
      card.appendChild(el("h3", { text: "Esta unidade carregou este turno? (ativa Lethal Hits)" }));
      const sel = el("select");
      [["", "— escolher —"], ["yes", "Sim"], ["no", "Não"]].forEach(([v, t]) => {
        const o = el("option", { value: v, text: t });
        sel.appendChild(o);
      });
      sel.onchange = e => { c.chargedThisTurn = e.target.value === "" ? null : e.target.value === "yes"; render(); };
      card.appendChild(sel);
      wrap.appendChild(card);
      return wrap;
    }

    const effectiveAttacksMax = attackIsFixed
      ? weapon.A + attacksBonus
      : (needsAttacksRollStep ? c.attacksRolled + attacksBonus : attacksMax);
    const attacksBonusSuffix = attacksBonus ? " · +" + attacksBonus + " attacks (" + attacksBonusLabel(weapon, c) + ")" : "";
    if (isTorrent) {
      wrap.appendChild(renderNumberStep({
        title: "Quantos hits (TORRENT — acerta sempre)?",
        hint: "🎯 Arma TORRENT: acerta automaticamente, não há hit roll. Introduz quantos ataques rolaste." + attacksBonusSuffix,
        threshold: null, stepKey: "hits", max: effectiveAttacksMax, countLabel: "Hits",
        roller: "attacker", rollerName: attackerRollerName, rollWhy: "Roll de ataque (hit roll) — TORRENT acerta sempre, mas contas na mesma quantos ataques fizeste.",
        onConfirm: n => { c.hits = n; c.step = 2; render(); },
        confirmLabel: "Confirmar hits →",
      }));
    } else {
      wrap.appendChild(renderNumberStep({
        title: "Precisas de " + thresholdText(effHitThreshold) + " para acertar",
        hint: statLabel(hitStat) + ": " + toHitValue(weapon, phaseKey) + (c.hitAdjust ? " · ajuste manual aplicado: " + (c.hitAdjust > 0 ? "+" : "") + c.hitAdjust : "") + (heavyBonus ? " · HEAVY: +1 ao acertar (não moveu mais de 3\")" : "") + attacksBonusSuffix,
        threshold: effHitThreshold > 6 ? 999 : effHitThreshold, stepKey: "hits", max: effectiveAttacksMax, countLabel: "Hits",
        adjust: { value: c.hitAdjust, onChange: v => { c.hitAdjust = Math.max(-5, Math.min(5, v)); render(); } },
        roller: "attacker", rollerName: attackerRollerName, rollWhy: "Roll de ataque (hit roll) — ver se acertas no alvo.",
        onConfirm: n => { c.hits = n; c.step = 2; render(); },
        confirmLabel: "Confirmar hits →",
      }));
    }
    return wrap;
  }

  if (c.step === 2) {
    if (sustainedX && c.sustainedHits === null) {
      wrap.appendChild(renderNumberStep({
        title: "Desses hits, quantos foram um 6 não modificado (Sustained Hits " + sustainedX + ")?",
        hint: "⚙️ " + weapon.name + " tem SUSTAINED HITS " + sustainedX + ": cada 6 não modificado no hit roll gera " + sustainedX + " hit(s) automático(s) adicional(is), sem rolar novamente.",
        threshold: 6, stepKey: "sustained", max: c.hits, countLabel: "Hits críticos (6 não modificado)",
        roller: "attacker", rollerName: attackerRollerName, rollWhy: "A contar, dos hits que já rolaste, quantos foram um 6 não modificado.",
        onConfirm: n => { c.sustainedHits = n; render(); },
        confirmLabel: "Confirmar críticos →",
      }));
      return wrap;
    }
    const effectiveHits = c.hits + (sustainedX ? (c.sustainedHits || 0) * sustainedX : 0);

    // Lethal Hits (condicional a ter carregado este turno): os 6 não
    // modificados no hit roll ferem automaticamente, saltando o wound roll
    // só para esses — tal como o Devastating Wounds salta o save só para
    // os críticos de ferir.
    if (lethalHitsActive && c.lethalHitCrits === null) {
      if (effectiveHits === 0) {
        c.lethalHitCrits = 0;
      } else {
        wrap.appendChild(renderNumberStep({
          title: "Desses hits, quantos foram um 6 não modificado (Lethal Hits)?",
          hint: "⚔️ Lethal Hits ativo (esta unidade carregou este turno): cada 6 não modificado no hit roll fere automaticamente, sem wound roll para esses.",
          threshold: 6, stepKey: "lethalhits", max: effectiveHits, countLabel: "Hits críticos (6 não modificado)",
          roller: "attacker", rollerName: attackerRollerName, rollWhy: "A contar, dos hits que já rolaste, quantos foram um 6 não modificado.",
          onConfirm: n => { c.lethalHitCrits = n; render(); },
          confirmLabel: "Confirmar críticos →",
        }));
        return wrap;
      }
    }
    const lethalCrits = lethalHitsActive ? (c.lethalHitCrits || 0) : 0;
    const hitsForWoundRoll = effectiveHits - lethalCrits;
    if (lethalHitsActive && hitsForWoundRoll <= 0) {
      c.wounds = lethalCrits;
      c.step = 3;
      return renderAttackCycle(phaseKey);
    }

    const antiSuffix = antiApplies ? " · ANTI-" + antiInfo.targetKeyword + " " + antiInfo.threshold + "+ aplicado (alvo tem a keyword " + antiInfo.targetKeyword + ")" : "";
    const sustainedSuffix = (sustainedX && c.sustainedHits) ? " · +" + (c.sustainedHits * sustainedX) + " hits de Sustained Hits" : "";
    const lethalSuffix = lethalCrits ? " · " + lethalCrits + " wound(s) automático(s) de Lethal Hits (já não entram neste roll)" : "";
    wrap.appendChild(renderNumberStep({
      title: "Precisas de " + thresholdText(effWoundThreshold) + " para ferir",
      hint: statLabel("S") + " " + weapon.S + " vs " + statLabel("T") + " " + targetT + " (" + target.label + ")" + (c.woundAdjust ? " · ajuste manual aplicado: " + (c.woundAdjust > 0 ? "+" : "") + c.woundAdjust : "") + antiSuffix + sustainedSuffix + lethalSuffix,
      threshold: effWoundThreshold > 6 ? 999 : effWoundThreshold, stepKey: "wounds", max: hitsForWoundRoll, countLabel: "Wounds",
      adjust: { value: c.woundAdjust, onChange: v => { c.woundAdjust = Math.max(-5, Math.min(5, v)); render(); } },
      roller: "attacker", rollerName: attackerRollerName, rollWhy: "Roll de ferir (wound roll) — ver se o hit é forte o suficiente para ferir o alvo.",
      onConfirm: n => { c.wounds = n + lethalCrits; c.step = 3; render(); },
      confirmLabel: "Confirmar wounds →",
    }));
    return wrap;
  }

  if (c.step === 3) {
    if (target.groups.length > 1 && !c.allocOrder) {
      const card = el("div", { class: "card" });
      card.appendChild(el("h2", { text: "Ordem de alocação (grupos)" }));
      card.appendChild(el("div", { class: "step-hint", text: target.label + " tem mais que um grupo de alocação. Declara a ordem — grupos já feridos primeiro, characters sempre por último." }));
      card.appendChild(renderAllocOrderPicker(target.groups, order => { c.allocOrder = order; render(); }));
      wrap.appendChild(card);
      return wrap;
    }

    if (isDevWounds && c.critWounds === null) {
      if (c.wounds === 0) {
        c.critWounds = 0;
        c.critDeadByGroup = {};
      } else {
        const critLabel = critThreshold === 6 ? "um 6 não modificado" :
          ("≥" + critThreshold + " — threshold de ANTI-" + antiInfo.targetKeyword + " " + antiInfo.threshold + "+ (um 6 não modificado conta sempre também)");
        wrap.appendChild(renderNumberStep({
          title: "Desses wounds, quantos foram " + critLabel + "?",
          hint: "⚠️ " + weapon.name + " tem DEVASTATING WOUNDS: cada critical wound vira mortal wound automática (Damage " + weapon.D + "), sem save, máx. 1 modelo morto por critical wound.",
          threshold: critThreshold, stepKey: "critwounds", max: c.wounds, countLabel: "Wounds críticos",
          roller: "attacker", rollerName: attackerRollerName, rollWhy: "A contar, dos wounds que já rolaste, quantos foram um critical wound.",
          onConfirm: n => {
            c.critWounds = n;
            c.critDeadByGroup = resolveDevastatingDeaths(target, n);
            if (c.wounds - n <= 0) {
              c.deadByGroup = c.critDeadByGroup;
              c.manualDamage = 0;
              c.failedSaves = 0;
            }
            render();
          },
          confirmLabel: "Confirmar críticos →",
        }));
        return wrap;
      }
    }
    if (isDevWounds && c.wounds - (c.critWounds || 0) <= 0) {
      c.step = 5;
      return renderAttackCycle(phaseKey);
    }

    const woundsForSave = c.wounds - (c.critWounds || 0);
    const distinctSaves = new Set(liveGroups.map(g => effSaveFor(g)));
    const needsPerGroup = distinctSaves.size > 1;

    if (!needsPerGroup) {
      const svText = saveThreshold > 6 ? "auto-falha" : (saveThreshold + "+");
      const hintParts = [statLabel("SV") + " " + defaultSaveGroup.stats.SV];
      if (defaultSaveGroup.stats.InvSV) hintParts.push(statLabel("InvSV") + " " + defaultSaveGroup.stats.InvSV + " (nunca modificado por AP)");
      hintParts.push("vs " + statLabel("AP") + " " + weapon.AP);
      wrap.appendChild(renderNumberStep({
        title: "O adversário precisa de " + svText + " para salvar",
        hint: hintParts.join(" / ") + (isDevWounds && c.critWounds ? " · " + c.critWounds + " wound(s) já resolvido(s) como mortal wounds diretas" : ""),
        threshold: saveThreshold > 6 ? 999 : saveThreshold, stepKey: "saves", max: woundsForSave, countLabel: "Saves falhados",
        invertThreshold: true,
        roller: "defender", rollerName: defenderRollerName, rollWhy: "Roll de salvaguarda (save roll) — tenta evitar o dano com a armadura ou InvSv.",
        onConfirm: n => {
          c.failedSaves = n;
          if (dmgInfo.fixed) {
            const total = n * (dmgInfo.value + meltaBonus);
            allocateDamage(target, total, c.critDeadByGroup);
            c.manualDamage = null;
            c.step = 5;
          } else {
            c.step = 4.5;
          }
          render();
        },
        confirmLabel: "Confirmar saves falhados →",
      }));
      return wrap;
    }

    // --- Grupos com saves efetivos diferentes: resolve grupo a grupo -------
    if (!c.groupFlow) {
      c.groupFlow = "assign";
      c.groupCursor = 0;
      c.woundsPool = woundsForSave;
      c.groupResults = {};
    }
    const order = c.allocOrder.filter(key => {
      const g = target.groups.find(gr => gr.key === key);
      return g && g.liveCount > 0;
    });

    // Só finaliza por falta de wounds quando estamos mesmo a decidir a que
    // grupo atribuir os próximos (groupFlow "assign") — nunca a meio de um
    // "save"/"damage" já em curso, senão o grupo que recebeu exatamente os
    // últimos wounds da pool nunca chegava a rolar o save dele.
    if (c.groupCursor >= order.length || (c.woundsPool <= 0 && c.groupFlow === "assign")) {
      const deadByGroup = {};
      let totalDamage = 0;
      target.groups.forEach(g => {
        const key = g.key;
        const r = c.groupResults[key];
        const critDead = (c.critDeadByGroup && c.critDeadByGroup[key]) || 0;
        deadByGroup[key] = critDead + ((r && r.dead) || 0);
        if (r) totalDamage += r.damage || 0;
      });
      c.deadByGroup = deadByGroup;
      c.manualDamage = totalDamage;
      c.step = 5;
      return renderAttackCycle(phaseKey);
    }

    const currentKey = order[c.groupCursor];
    const currentGroup = target.groups.find(g => g.key === currentKey);
    const isLastGroup = c.groupCursor === order.length - 1;
    const progressLabel = "Grupo " + (c.groupCursor + 1) + "/" + order.length + " da ordem de alocação — restam " + c.woundsPool + " wound(s) por atribuir";

    if (c.groupFlow === "next") {
      c.groupCursor += 1;
      c.groupFlow = "assign";
      return renderAttackCycle(phaseKey);
    }

    if (c.groupFlow === "assign") {
      if (isLastGroup) {
        c.groupResults[currentKey] = { assignedWounds: c.woundsPool };
        c.groupFlow = c.woundsPool > 0 ? "save" : "next";
        return renderAttackCycle(phaseKey);
      }
      const card = el("div", { class: "card" });
      card.appendChild(el("div", { class: "step-hint", text: progressLabel }));
      card.appendChild(el("h3", { text: "Quantos wounds atribuis a " + currentGroup.label + "?" }));
      let v = Math.min(c.woundsPool, currentGroup.liveCount);
      const inp = el("input", { type: "number" }); inp.value = v; inp.min = "0"; inp.max = String(c.woundsPool);
      inp.oninput = e => { v = Math.max(0, Math.min(c.woundsPool, parseInt(e.target.value) || 0)); };
      card.appendChild(inp);
      const btn = el("button", { class: "primary", text: "Confirmar wounds deste grupo →" });
      btn.style.cssText = "width:100%;margin-top:8px;";
      btn.onclick = () => {
        c.groupResults[currentKey] = { assignedWounds: v };
        c.woundsPool -= v;
        c.groupFlow = v > 0 ? "save" : "next";
        render();
      };
      card.appendChild(btn);
      wrap.appendChild(card);
      return wrap;
    }

    if (c.groupFlow === "save") {
      const gSave = effSaveFor(currentGroup);
      const svText = gSave > 6 ? "auto-falha" : (gSave + "+");
      const hintParts = [progressLabel, statLabel("SV") + " " + currentGroup.stats.SV];
      if (currentGroup.stats.InvSV) hintParts.push(statLabel("InvSV") + " " + currentGroup.stats.InvSV + " (nunca modificado por AP)");
      hintParts.push("vs " + statLabel("AP") + " " + weapon.AP);
      wrap.appendChild(renderNumberStep({
        title: currentGroup.label + " (" + c.groupResults[currentKey].assignedWounds + " wound(s)): precisa de " + svText + " para salvar",
        hint: hintParts.join(" / "),
        threshold: gSave > 6 ? 999 : gSave, stepKey: "save-" + currentKey,
        max: c.groupResults[currentKey].assignedWounds, countLabel: "Saves falhados",
        invertThreshold: true,
        roller: "defender", rollerName: defenderRollerName, rollWhy: "Roll de salvaguarda (save roll) — tenta evitar o dano com a armadura ou InvSv.",
        onConfirm: n => {
          c.groupResults[currentKey].failedSaves = n;
          if (dmgInfo.fixed) {
            const dmg = n * (dmgInfo.value + meltaBonus);
            const critDeadHere = (c.critDeadByGroup && c.critDeadByGroup[currentKey]) || 0;
            const liveAfterCrit = Math.max(0, currentGroup.liveCount - critDeadHere);
            c.groupResults[currentKey].damage = dmg;
            c.groupResults[currentKey].dead = Math.min(liveAfterCrit, Math.floor(dmg / currentGroup.stats.W));
            c.groupFlow = "next";
          } else {
            c.groupFlow = "damage";
          }
          render();
        },
        confirmLabel: "Confirmar saves falhados deste grupo →",
      }));
      return wrap;
    }

    if (c.groupFlow === "damage") {
      const card = el("div", { class: "card" });
      card.appendChild(renderRollerBadge("attacker", attackerRollerName, "Roll de Dano — quanto dano cada wound que falhou o save causa."));
      card.appendChild(el("div", { class: "step-hint", text: progressLabel }));
      card.appendChild(el("h3", { text: currentGroup.label + " — dano total (arma com " + statLabel("D") + " variável: " + weapon.D + ")" }));
      const meltaNote = meltaBonus ? (" (+" + meltaBonus + " por save falhado de MELTA — a app soma-o a seguir, não incluas no valor abaixo)") : "";
      card.appendChild(el("div", { class: "step-hint", text: "Rola fisicamente " + c.groupResults[currentKey].failedSaves + " vez(es) e soma o total." + meltaNote }));
      let v = 0;
      const inp = el("input", { type: "number" }); inp.value = 0; inp.min = "0";
      inp.oninput = e => { v = Math.max(0, parseInt(e.target.value) || 0); };
      card.appendChild(inp);
      const btn = el("button", { class: "primary", text: "Confirmar dano deste grupo →" });
      btn.style.cssText = "width:100%;margin-top:8px;";
      btn.onclick = () => {
        const critDeadHere = (c.critDeadByGroup && c.critDeadByGroup[currentKey]) || 0;
        const liveAfterCrit = Math.max(0, currentGroup.liveCount - critDeadHere);
        const total = v + meltaBonus * c.groupResults[currentKey].failedSaves;
        c.groupResults[currentKey].damage = total;
        c.groupResults[currentKey].dead = Math.min(liveAfterCrit, Math.floor(total / currentGroup.stats.W));
        c.groupFlow = "next";
        render();
      };
      card.appendChild(btn);
      wrap.appendChild(card);
      return wrap;
    }

    return wrap;
  }

  if (c.step === 4.5) {
    const card = el("div", { class: "card" });
    card.appendChild(renderRollerBadge("attacker", attackerRollerName, "Roll de Dano — quanto dano cada wound que falhou o save causa."));
    card.appendChild(el("h2", { text: "Dano total (arma com " + statLabel("D") + " variável: " + weapon.D + ")" }));
    const meltaNote = meltaBonus ? (" (+" + meltaBonus + " por save falhado de MELTA — a app soma-o a seguir, não incluas no valor abaixo)") : "";
    card.appendChild(el("div", { class: "step-hint", text: "Esta arma tem " + statLabel("D") + " em dados (" + weapon.D + "). Rola fisicamente " + c.failedSaves + " vez(es) e soma o total." + meltaNote }));
    const inp = el("input", { type: "number" }); inp.value = 0;
    let v = 0;
    inp.oninput = e => { v = Math.max(0, parseInt(e.target.value) || 0); };
    card.appendChild(inp);
    const btn = el("button", { class: "primary", text: "Confirmar dano total →" });
    btn.style.width = "100%"; btn.style.marginTop = "8px";
    btn.onclick = () => {
      const total = v + meltaBonus * c.failedSaves;
      c.manualDamage = total;
      allocateDamage(target, total, c.critDeadByGroup);
      c.step = 5;
      render();
    };
    card.appendChild(btn);
    wrap.appendChild(card);
    return wrap;
  }

  if (c.step === 5) {
    // FEEL NO PAIN: ability de UNIDADE (não de arma), detetada no campo
    // "abilities" da datasheet do alvo — sempre DEPOIS do save normal e das
    // mortal wounds de Devastating Wounds, nunca antes. Passo adicional, só
    // aparece se houver mortes já calculadas para cancelar.
    const fnp = feelNoPainFor(target);
    const rawTotalDead = Object.values(c.deadByGroup || {}).reduce((a, b) => a + b, 0);
    if (fnp && c.fnpSuccesses === null && rawTotalDead > 0) {
      wrap.appendChild(renderNumberStep({
        title: "Feel No Pain " + thresholdText(fnp.value) + " — quantos passaram?",
        hint: "⚕️ " + fnp.label + ". Rola 1 dado por cada uma das " + rawTotalDead + " mortes já calculadas (depois do save normal) — cada sucesso cancela 1 morte.",
        threshold: fnp.value > 6 ? 999 : fnp.value, stepKey: "fnp", max: rawTotalDead, countLabel: "Sucessos de Feel No Pain",
        roller: "defender", rollerName: defenderRollerName, rollWhy: "Roll de Feel No Pain — tenta cancelar uma morte já calculada.",
        onConfirm: n => {
          c.fnpSuccesses = n;
          const order = (c.allocOrder && c.allocOrder.length) ? c.allocOrder : target.groups.map(g => g.key);
          c.deadByGroup = applyFeelNoPain(c.deadByGroup, order, n);
          render();
        },
        confirmLabel: "Confirmar Feel No Pain →",
      }));
      return wrap;
    }

    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { text: "Resultado" }));
    const critCount = c.critWounds || 0;
    const critDamageDisplay = dmgInfo.fixed ? critCount * dmgInfo.value : null;
    const normalDamage = c.manualDamage !== null ? c.manualDamage : (dmgInfo.fixed ? (c.failedSaves || 0) * (dmgInfo.value + meltaBonus) : 0);
    const totalDead = Object.values(c.deadByGroup || {}).reduce((a, b) => a + b, 0);
    if (critCount > 0) {
      card.appendChild(el("div", { class: "step-hint", text: "⚠️ Devastating Wounds: " + critCount + " critical wound(s) → mortal wounds diretas, sem save (máx. 1 modelo morto por critical wound)." }));
    }
    if (fnp && c.fnpSuccesses) {
      // rawTotalDead já reflete deadByGroup PÓS-FNP (foi recalculado neste
      // render); o total pré-FNP é esse mais os sucessos que cancelaram mortes.
      card.appendChild(el("div", { class: "step-hint", text: "⚕️ Feel No Pain " + thresholdText(fnp.value) + ": " + c.fnpSuccesses + " sucesso(s) cancelaram " + c.fnpSuccesses + " morte(s) (de " + (rawTotalDead + c.fnpSuccesses) + " antes do FNP)." }));
    }
    const totalText = critDamageDisplay !== null ? ((critDamageDisplay + normalDamage) + " dano total") : "dano total variável";
    const res = el("div", { class: "result final", text: totalText + " → " + totalDead + " modelo(s) morto(s)" });
    card.appendChild(res);
    if (target.groups.length > 1) {
      const table = el("table");
      const tbody = el("tbody");
      target.groups.forEach(g => {
        const tr = el("tr");
        tr.appendChild(el("td", { text: g.label }));
        const td2 = el("td", { text: (c.deadByGroup[g.key] || 0) + " morto(s) (de " + g.liveCount + " vivos)" });
        td2.style.textAlign = "right";
        tr.appendChild(td2);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      card.appendChild(table);
    }
    // Duas ações distintas e não-equivalentes: uma unidade real costuma
    // disparar/lutar com várias armas diferentes na mesma ativação (Land
    // Speeder: 3 armas; Big Mek Dakkarig: 2), normalmente contra alvos
    // diferentes — por isso "continuar com esta unidade" NUNCA pode
    // acontecer automaticamente a seguir a um só ataque resolvido.
    const endUnitBtn = el("button", { class: "primary", text: "Confirmar e terminar esta unidade nesta fase" });
    endUnitBtn.style.width = "100%";
    endUnitBtn.onclick = () => {
      logAttack(attacker, weapon, target, totalDead);
      applyDeaths(target, c.deadByGroup);
      markWeaponUsed(attacker.id, weapon);
      markUnitActedThisPhase(attacker.id);
      state.cycle = emptyCycle();
      render();
    };
    card.appendChild(endUnitBtn);
    const anotherBtn = el("button", { text: "Confirmar e resolver outro ataque com esta unidade" });
    anotherBtn.style.cssText = "width:100%;margin-top:8px;";
    anotherBtn.onclick = () => {
      logAttack(attacker, weapon, target, totalDead);
      applyDeaths(target, c.deadByGroup);
      markWeaponUsed(attacker.id, weapon);
      const keepAttackerId = attacker.id;
      state.cycle = emptyCycle();
      state.cycle.attackerId = String(keepAttackerId);
      render();
    };
    card.appendChild(anotherBtn);
    wrap.appendChild(card);
    return wrap;
  }

  return wrap;
}

// preDead (opcional): mortes já decididas antes deste cálculo (ex: mortal
// wounds diretas de DEVASTATING WOUNDS) — reduz a pool de modelos vivos de
// cada grupo antes de distribuir o dano normal, sem contar o mesmo modelo
// morto duas vezes.
function allocateDamage(target, totalDamage, preDead) {
  const c = state.cycle;
  const order = (c.allocOrder && c.allocOrder.length) ? c.allocOrder : target.groups.map(g => g.key);
  let remaining = totalDamage;
  const dead = {};
  order.forEach(key => {
    const g = target.groups.find(gr => gr.key === key);
    if (!g) return;
    const w = g.stats.W;
    const already = (preDead && preDead[key]) || 0;
    const liveAfterPre = Math.max(0, g.liveCount - already);
    const canDie = Math.min(liveAfterPre, Math.floor(remaining / w));
    dead[key] = already + canDie;
    remaining -= canDie * w;
  });
  c.deadByGroup = dead;
}

// DEVASTATING WOUNDS: cada critical wound (6 não modificado no wound roll)
// vira mortal wounds diretas, sem save, mas mata no máximo 1 modelo por
// critical wound — independentemente do valor de Damage da arma (ver
// core_rules_reference.md, glossário de keywords). Por isso o cálculo aqui
// não precisa do valor de dano, só da contagem de critical wounds.
function resolveDevastatingDeaths(target, critCount) {
  const c = state.cycle;
  const order = (c.allocOrder && c.allocOrder.length) ? c.allocOrder : target.groups.map(g => g.key);
  const dead = {};
  let remaining = critCount;
  order.forEach(key => {
    const g = target.groups.find(gr => gr.key === key);
    if (!g) return;
    const alive = Math.max(0, g.liveCount - (dead[key] || 0));
    const canDie = Math.min(alive, remaining);
    dead[key] = (dead[key] || 0) + canDie;
    remaining -= canDie;
  });
  return dead;
}

function applyDeaths(target, deadByGroup) {
  [state.setup.playerA, state.setup.playerB].forEach(player => {
    player.units.forEach(u => {
      if (u.id !== target.id) return;
      u.groups.forEach(g => { g.liveCount = Math.max(0, g.liveCount - (deadByGroup[g.key] || 0)); });
    });
  });
}

function renderPicker(instances, phaseKey) {
  const card = el("div", { class: "card" });
  const hitStat = phaseKey === "fight" ? "WS" : "BS";
  card.appendChild(el("h2", { text: (phaseKey === "fight" ? "Fight Phase" : "Shooting Phase") + " — Unidade, arma e alvo" }));
  const c = state.cycle;

  // Shooting Phase: só o jogador ativo (activePlayer()) dispara, por isso o
  // atacante só pode ser uma unidade dele. Fight Phase: ambos os jogadores
  // lutam, alternadamente, dentro da mesma fase — mantém as duas listas
  // juntas (filtrar por jogador aqui impediria escolher a unidade certa
  // quando fosse a vez do adversário lutar).
  const activeOwner = state.game.activePlayerKey === "playerA" ? "A" : "B";
  const actedThisPhase = actedSetForCurrentPhase();
  const attackerInstances = (phaseKey === "shooting" ? instances.filter(u => u.owner === activeOwner) : instances)
    .filter(u => !actedThisPhase.includes(String(u.id)));

  const f1 = el("div", { class: "field" });
  f1.appendChild(el("label", { text: "Unidade atacante" + (phaseKey === "shooting" ? " (" + activePlayerName() + ")" : "") }));
  const sel1 = el("select");
  sel1.appendChild(el("option", { value: "", text: "— escolher —" }));
  attackerInstances.forEach(u => {
    const o = el("option", { value: u.id, text: u.ownerName + ": " + u.label });
    if (String(u.id) === String(c.attackerId)) o.selected = true;
    sel1.appendChild(o);
  });
  sel1.onchange = e => {
    c.attackerId = e.target.value; c.weaponIdx = "";
    c.rapidFireHalfRange = null; c.meltaHalfRange = null; c.blastCleaveModels = null;
    c.abilityAttacksAdjust = 0;
    render();
  };
  f1.appendChild(sel1);
  card.appendChild(f1);

  const attacker = findInstance(c.attackerId);
  const attackerWeapons = attacker ? weaponsForPhase(attacker, phaseKey) : [];
  const availableWeaponCount = attacker ? attackerWeapons.filter(w => !isWeaponUsed(attacker.id, w)).length : 0;
  const showSource = attacker && attacker.datasheetNames.length > 1;
  if (attacker) {
    const f2 = el("div", { class: "field" });
    f2.appendChild(el("label", { text: phaseKey === "fight" ? "Arma (combate)" : "Arma (tiro)" }));
    if (attackerWeapons.length === 0) {
      f2.appendChild(el("div", { class: "step-hint", text: phaseKey === "fight" ? "Esta unidade não tem armas de combate." : "Esta unidade não tem armas de tiro." }));
    } else if (availableWeaponCount === 0) {
      f2.appendChild(el("div", { class: "step-hint", text: "Esta unidade já usou todas as armas disponíveis nesta fase — escolhe outra unidade, ou confirma \"terminar esta unidade\" no último ataque resolvido." }));
    } else {
      const sel2 = el("select");
      sel2.appendChild(el("option", { value: "", text: "— escolher —" }));
      attackerWeapons.forEach((w, i) => {
        // Cada arma dispara/luta uma vez por fase — não voltar a oferecer
        // uma arma já usada nesta ativação enquanto a unidade continuar
        // selecionada via "resolver outro ataque com esta unidade".
        if (isWeaponUsed(attacker.id, w)) return;
        const label = w.name + (showSource ? " [" + w.sourceDatasheet + "]" : "") + " (A:" + w.A + " " + hitStat + ":" + toHitValue(w, phaseKey) + " S:" + w.S + " AP:" + w.AP + " D:" + w.D + ")";
        const o = el("option", { value: i, text: label });
        if (String(i) === String(c.weaponIdx)) o.selected = true;
        sel2.appendChild(o);
      });
      sel2.onchange = e => {
        c.weaponIdx = e.target.value;
        c.rapidFireHalfRange = null; c.meltaHalfRange = null;
        c.abilityAttacksAdjust = 0;
        render();
      };
      f2.appendChild(sel2);
    }
    card.appendChild(f2);
  }

  const f3 = el("div", { class: "field" });
  f3.appendChild(el("label", { text: "Unidade alvo" }));
  const sel3 = el("select");
  sel3.appendChild(el("option", { value: "", text: "— escolher —" }));
  instances.filter(u => !attacker || u.owner !== attacker.owner).forEach(u => {
    const o = el("option", { value: u.id, text: u.ownerName + ": " + u.label });
    if (String(u.id) === String(c.targetId)) o.selected = true;
    sel3.appendChild(o);
  });
  sel3.onchange = e => {
    c.targetId = e.target.value;
    c.rapidFireHalfRange = null; c.meltaHalfRange = null; c.blastCleaveModels = null;
    c.abilityAttacksAdjust = 0;
    render();
  };
  f3.appendChild(sel3);
  card.appendChild(f3);

  const weapon = attacker && c.weaponIdx !== "" ? attackerWeapons[c.weaponIdx] : null;
  const target = findInstance(c.targetId);

  // RAPID FIRE X / CLEAVE X / MELTA X / BLAST X: a app nunca decide a
  // condição (alcance medido, tamanho do alvo) — só pergunta e aplica o
  // bónus depois de o jogador confirmar. Sem nenhuma destas keywords na
  // arma escolhida, nada disto aparece e o comportamento fica inalterado.
  if (weapon) {
    const rapidFireX = keywordValue(weapon, "RAPID FIRE");
    const meltaX = keywordValue(weapon, "MELTA");
    const cleaveX = keywordValue(weapon, "CLEAVE");
    const blastX = keywordValue(weapon, "BLAST");

    if (rapidFireX !== null) {
      const f = el("div", { class: "field" });
      f.appendChild(el("label", { text: "RAPID FIRE " + rapidFireX + " — estás a metade do alcance ou menos?" }));
      const sel = el("select");
      [["", "— escolher —"], ["yes", "Sim"], ["no", "Não"]].forEach(([v, t]) => {
        const o = el("option", { value: v, text: t });
        if ((v === "yes" && c.rapidFireHalfRange === true) || (v === "no" && c.rapidFireHalfRange === false)) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = e => { c.rapidFireHalfRange = e.target.value === "" ? null : e.target.value === "yes"; render(); };
      f.appendChild(sel);
      card.appendChild(f);
    }
    if (meltaX !== null) {
      const f = el("div", { class: "field" });
      f.appendChild(el("label", { text: "MELTA " + meltaX + " — estás a metade do alcance ou menos?" }));
      const sel = el("select");
      [["", "— escolher —"], ["yes", "Sim"], ["no", "Não"]].forEach(([v, t]) => {
        const o = el("option", { value: v, text: t });
        if ((v === "yes" && c.meltaHalfRange === true) || (v === "no" && c.meltaHalfRange === false)) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = e => { c.meltaHalfRange = e.target.value === "" ? null : e.target.value === "yes"; render(); };
      f.appendChild(sel);
      card.appendChild(f);
    }
    if (cleaveX !== null || blastX !== null) {
      const f = el("div", { class: "field" });
      f.appendChild(el("label", { text: (cleaveX !== null ? "CLEAVE " + cleaveX : "BLAST " + blastX) + " — quantos modelos tem a unidade alvo?" }));
      const inp = el("input", { type: "number" });
      inp.min = "0";
      if (c.blastCleaveModels != null) inp.value = c.blastCleaveModels;
      inp.oninput = e => { c.blastCleaveModels = e.target.value === "" ? null : Math.max(0, parseInt(e.target.value, 10) || 0); render(); };
      f.appendChild(inp);
      card.appendChild(f);
    }

    // Ajuste manual genérico ao Attacks — para abilities de UNIDADE que o
    // sistema de keywords acima não cobre porque não estão na arma (ex:
    // Dakkablitz +6A no Blitzkannon, Hail of Bolts +2A nos Bolt Rifles,
    // Da Biggest and da Best +4A durante o Waaagh!). Fica sempre visível,
    // independente da arma escolhida; o jogador confirma o valor que sabe
    // que se aplica — a app nunca decide a condição sozinha.
    const abilityField = el("div", { class: "field" });
    abilityField.appendChild(el("label", { text: "Ajuste manual de Attacks (ability de unidade)" }));
    abilityField.appendChild(el("div", { class: "step-hint", text: "Para bónus não cobertos acima — ex: Dakkablitz +6A, Hail of Bolts +2A, Da Biggest and da Best +4A. Confirma só o que sabes que se aplica agora." }));
    abilityField.appendChild(renderAdjustControl(c.abilityAttacksAdjust, v => { c.abilityAttacksAdjust = Math.max(-20, Math.min(20, v)); render(); }));
    card.appendChild(abilityField);
  }

  const startBtn = el("button", { class: "primary", text: "Iniciar ciclo de ataque →" });
  startBtn.style.width = "100%";
  startBtn.disabled = !(attacker && weapon && target && weaponPreCycleQuestionsAnswered(weapon, c));
  startBtn.onclick = () => {
    c.step = 1; c.hits = null; c.wounds = null; c.failedSaves = null;
    c.allocOrder = target.groups.length > 1 ? null : target.groups.map(g => g.key);
    c.manualDamage = null; c.deadByGroup = null;
    c.hitAdjust = 0; c.woundAdjust = 0;
    c.critWounds = null; c.critDeadByGroup = null;
    c.sustainedHits = null; c.fnpSuccesses = null; c.attacksRolled = null;
    c.heavyStationary = null; c.chargedThisTurn = null; c.lethalHitCrits = null;
    c.groupFlow = null; c.groupCursor = 0; c.woundsPool = 0; c.groupResults = {};
    render();
  };
  card.appendChild(startBtn);
  return card;
}

function renderAdjustControl(value, onChange) {
  const wrap = el("span", { class: "adjust-control" });
  const minus = el("button", { class: "small", text: "−" });
  minus.type = "button";
  minus.onclick = () => onChange((value || 0) - 1);
  const val = el("span", { class: "adjust-value", text: (value > 0 ? "+" : "") + value });
  const plus = el("button", { class: "small", text: "+" });
  plus.type = "button";
  plus.onclick = () => onChange((value || 0) + 1);
  wrap.appendChild(minus);
  wrap.appendChild(val);
  wrap.appendChild(plus);
  return wrap;
}
function renderNumberStep(opts) {
  const card = el("div", { class: "card" });
  if (opts.roller) card.appendChild(renderRollerBadge(opts.roller, opts.rollerName, opts.rollWhy));
  card.appendChild(el("div", { class: "step-hint", text: opts.hint }));
  card.appendChild(el("h3", { text: opts.title }));
  const c = state.cycle;
  // threshold === null significa "este passo só tem UM valor a introduzir"
  // (o resultado já resolvido de um dado de notação variável da própria
  // arma, ex: "rolaste D3, saiu quanto?", ou Damage variável) — não há
  // sucesso/falha nenhum para comparar. A grelha 1-6 não se aplica: nesse
  // modo ela contaria CLIQUES, não valores (clicar 3 vezes num D3 registava
  // "3" mesmo que as faces fossem 6,5,4). Só digitar o número já resolvido.
  const singleValueStep = opts.threshold === null;
  const max = (typeof opts.max === "number" && isFinite(opts.max)) ? Math.max(0, opts.max) : null;

  if (opts.adjust) {
    const row = el("div", { class: "adjust-row" });
    row.appendChild(el("span", { class: "step-hint", text: "Ajuste manual (cobertura, stratagems, etc.):" }));
    row.appendChild(renderAdjustControl(opts.adjust.value, opts.adjust.onChange));
    card.appendChild(row);
  }

  if (max !== null && opts.countLabel) {
    card.appendChild(el("div", { class: "step-hint", text: opts.countLabel + " — máximo " + max + " nesta etapa", style: "color:var(--gold);" }));
  }

  // O ditado por voz dita vários números para SOMAR sucessos (hits/wounds/
  // saves) — não faz sentido para um passo de "diz UM número já resolvido",
  // pela mesma razão que a grelha de dados também fica desligada aí.
  if (!singleValueStep) card.appendChild(renderVoiceControl(opts, max));
  const voiceStatus = (c.voice[opts.stepKey] || {}).status;
  if (voiceStatus === "review") return card;

  const body = el("div");
  if (singleValueStep) {
    const inp = el("input", { type: "number" }); inp.min = "0";
    if (max !== null) inp.max = String(max);
    let val = 0;
    inp.value = 0;
    inp.oninput = e => {
      let n = Math.max(0, parseInt(e.target.value) || 0);
      if (max !== null && n > max) { n = max; e.target.value = max; }
      val = n;
    };
    body.appendChild(inp);
    const btn = el("button", { class: "primary", text: opts.confirmLabel || "Confirmar" });
    btn.style.width = "100%"; btn.style.marginTop = "8px";
    btn.onclick = () => opts.onConfirm(val);
    body.appendChild(btn);
  } else {
    // Campo para digitar + grelha 1-6 sempre visíveis ao mesmo tempo — sem
    // toggle a esconder um dos dois. No telemóvel costuma ser mais rápido
    // ir clicando a grelha à medida que lês os dados físicos; o campo
    // continua ali para quem preferir digitar o total diretamente. Clicar
    // num dado atualiza sempre o campo para refletir a contagem atual.
    // opts.invertThreshold: usado nos passos de "saves falhados" — o
    // threshold aí é o que o ALVO precisa para SALVAR (defender-se), por
    // isso o que interessa contar é o oposto: quantos resultados ficaram
    // ABAIXO do threshold (esses é que falham o save e causam dano). Sem
    // isto, contar ">= threshold" na grelha estaria a somar os saves que
    // PASSARAM, invertendo o resultado.
    const rolls = c.diceRolls[opts.stepKey] || (c.diceRolls[opts.stepKey] = []);
    const meetsThreshold = r => opts.invertThreshold ? r < opts.threshold : r >= opts.threshold;
    const successesFromRolls = rolls.filter(meetsThreshold).length;
    let val = successesFromRolls;

    const inp = el("input", { type: "number" }); inp.min = "0";
    if (max !== null) inp.max = String(max);
    inp.value = successesFromRolls;
    inp.oninput = e => {
      let n = Math.max(0, parseInt(e.target.value) || 0);
      if (max !== null && n > max) { n = max; e.target.value = max; }
      val = n;
    };
    body.appendChild(inp);

    const atMax = max !== null && rolls.length >= max;
    const grid = el("div", { class: "diegrid" });
    for (let n = 1; n <= 6; n++) {
      const isHit = meetsThreshold(n);
      const btn = el("button", { class: isHit ? "hit" : "", text: String(n) });
      btn.disabled = atMax;
      btn.onclick = () => { if (!(max !== null && rolls.length >= max)) { rolls.push(n); render(); } };
      grid.appendChild(btn);
    }
    body.appendChild(grid);
    const tally = el("div", { class: "tally" });
    tally.appendChild(document.createTextNode(rolls.length + (max !== null ? "/" + max : "") + " dados registados — "));
    tally.appendChild(el("b", { text: successesFromRolls + (opts.invertThreshold ? " falha(s)" : " sucesso(s)"), style: "color:var(--text)" }));
    if (rolls.length > 0) {
      const undoBtn = el("button", { class: "small", text: "desfazer" });
      undoBtn.style.marginLeft = "8px";
      undoBtn.onclick = () => { rolls.pop(); render(); };
      tally.appendChild(undoBtn);
    }
    body.appendChild(tally);
    if (atMax) body.appendChild(el("div", { class: "step-hint", text: "Máximo atingido — usa \"desfazer\" para tirar um dado, ou digita o número diretamente." }));
    const btn = el("button", { class: "primary", text: opts.confirmLabel || "Confirmar" });
    btn.style.width = "100%"; btn.style.marginTop = "8px";
    btn.onclick = () => { c.diceRolls[opts.stepKey] = []; opts.onConfirm(val); };
    body.appendChild(btn);
  }
  card.appendChild(body);

  return card;
}

function renderVoiceControl(opts, max) {
  const c = state.cycle;
  const stepKey = opts.stepKey;
  if (!c.voice[stepKey]) c.voice[stepKey] = { status: "idle" };
  const v = c.voice[stepKey];
  const Ctor = getSpeechRecognitionCtor();
  const wrap = el("div");

  if (!Ctor) {
    const row = el("div", { class: "voice-row" });
    const btn = el("button", { class: "mic-btn", text: "🎤" });
    btn.disabled = true;
    row.appendChild(btn);
    row.appendChild(el("div", { class: "voice-status", text: "Ditado por voz não suportado neste browser — usa o clique ou o teclado." }));
    wrap.appendChild(row);
    return wrap;
  }

  if (v.status === "review") {
    const panel = el("div", { class: "voice-review" });
    panel.appendChild(el("div", { class: "step-hint", text: "Confere os resultados antes de confirmar — corrige ou remove o que não bateu certo." }));
    const chips = el("div", { class: "voice-chips" });
    v.entries.forEach((entry, i) => {
      const chip = el("div", { class: "voice-chip" + (entry.value === null ? " invalid" : "") });
      chip.appendChild(el("div", { class: "raw", text: "\"" + entry.raw + "\"" }));
      const inp = el("input", { type: "number" });
      inp.min = "1"; inp.max = "6";
      inp.value = entry.value !== null ? entry.value : "";
      inp.placeholder = "?";
      inp.oninput = e => {
        const n = parseInt(e.target.value, 10);
        entry.value = (n >= 1 && n <= 6) ? n : null;
        render();
      };
      chip.appendChild(inp);
      const rm = el("button", { text: "✕" });
      rm.onclick = () => { v.entries.splice(i, 1); render(); };
      chip.appendChild(rm);
      chips.appendChild(chip);
    });
    panel.appendChild(chips);
    const addBtn = el("button", { class: "small", text: "+ Adicionar número" });
    addBtn.onclick = () => { v.entries.push({ raw: "manual", value: null }); render(); };
    panel.appendChild(addBtn);

    const validValues = v.entries.map(e => e.value).filter(x => x !== null);
    const invalidCount = v.entries.length - validValues.length;
    const overMax = max !== null && validValues.length > max;
    // Mesma inversão que a grelha de dados: nos passos de "saves falhados"
    // (opts.invertThreshold) o que conta é quem ficou ABAIXO do threshold
    // de salvar, não quem o passou.
    const meetsThreshold = x => opts.invertThreshold ? x < opts.threshold : x >= opts.threshold;
    const successes = opts.threshold === null ? validValues.length : validValues.filter(meetsThreshold).length;
    const summary = el("div", { class: "tally" });
    summary.textContent = validValues.length + (max !== null ? "/" + max : "") + " número(s) válido(s)"
      + (invalidCount > 0 ? ", " + invalidCount + " por corrigir/remover" : "")
      + " — " + successes + (opts.threshold === null ? " no total" : (opts.invertThreshold ? " falha(s)" : " sucesso(s)"));
    panel.appendChild(summary);

    const actionRow = el("div", { class: "row" });
    actionRow.style.cssText = "margin-top:8px;gap:8px;";
    const discardBtn = el("button", { text: "Descartar" });
    discardBtn.style.flex = "1";
    discardBtn.onclick = () => { c.voice[stepKey] = { status: "idle" }; render(); };
    const confirmBtn = el("button", { class: "primary", text: opts.confirmLabel || "Confirmar" });
    confirmBtn.style.flex = "1";
    confirmBtn.disabled = invalidCount > 0 || overMax;
    confirmBtn.onclick = () => {
      c.voice[stepKey] = { status: "idle" };
      opts.onConfirm(successes);
    };
    actionRow.appendChild(discardBtn);
    actionRow.appendChild(confirmBtn);
    panel.appendChild(actionRow);
    if (invalidCount > 0) {
      panel.appendChild(el("div", { class: "step-hint", text: "Corrige (digita 1-6) ou remove (✕) os números marcados a vermelho antes de confirmar." }));
    }
    if (overMax) {
      panel.appendChild(el("div", { class: "step-hint", text: "Reconheceste mais números válidos (" + validValues.length + ") do que o máximo desta etapa (" + max + ") — remove os que sobram antes de confirmar." }));
    }
    wrap.appendChild(panel);
    return wrap;
  }

  const row = el("div", { class: "voice-row" });
  const btn = el("button", { class: "mic-btn" + (v.status === "listening" ? " listening" : "") , text: "🎤" });
  const status = el("div", { class: "voice-status" + (v.status === "listening" ? " listening" : "") });
  if (v.status === "denied") {
    status.textContent = "Permissão de microfone recusada — usa o clique ou o teclado. Podes tentar de novo se mudares a permissão do browser.";
  } else if (v.status === "listening") {
    status.textContent = "A ouvir... diz os números separados por pausa (ex.: \"seis, três, cinco\") e depois toca no microfone para parar.";
  } else {
    status.textContent = "Dita os resultados em voz alta como alternativa ao clique (pt-PT).";
  }
  btn.onclick = () => {
    if (v.status === "listening") {
      if (v._recognition) { try { v._recognition.stop(); } catch (e) {} }
      return;
    }
    startVoiceListening(stepKey);
  };
  row.appendChild(btn);
  row.appendChild(status);
  wrap.appendChild(row);
  if (v.status === "listening" && v.interim) {
    wrap.appendChild(el("div", { class: "step-hint", text: "Reconhecido até agora: " + v.interim }));
  }
  return wrap;
}

function startVoiceListening(stepKey) {
  const c = state.cycle;
  const Ctor = getSpeechRecognitionCtor();
  const recognition = new Ctor();
  recognition.lang = "pt-PT";
  recognition.continuous = true;
  recognition.interimResults = true;
  let finalTranscript = "";

  c.voice[stepKey] = { status: "listening", _recognition: recognition, interim: "" };
  render();

  recognition.onresult = event => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += " " + transcript;
      else interim += transcript;
    }
    if (c.voice[stepKey] && c.voice[stepKey].status === "listening") {
      c.voice[stepKey].interim = (finalTranscript + " " + interim).trim();
      render();
    }
  };
  recognition.onerror = event => {
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      c.voice[stepKey] = { status: "denied" };
    } else {
      c.voice[stepKey] = { status: "idle" };
    }
    render();
  };
  recognition.onend = () => {
    const v = c.voice[stepKey];
    if (!v || v.status !== "listening") return; // já tratado por onerror (ex: recusado)
    const transcript = finalTranscript.trim() || v.interim || "";
    const entries = transcript ? parseSpokenNumbers(transcript) : [];
    c.voice[stepKey] = entries.length > 0 ? { status: "review", entries } : { status: "idle" };
    render();
  };

  try {
    recognition.start();
  } catch (e) {
    c.voice[stepKey] = { status: "idle" };
    render();
  }
}

function renderAllocOrderPicker(groups, onConfirm) {
  const wrap = el("div");
  // Ordem sugerida por defeito: corpo do esquadrão primeiro, characters
  // (líder/support anexados) por último — a regra oficial que já está
  // escrita na dica acima do picker. O jogador pode sempre reordenar com
  // as setas se o caso concreto for diferente (ex: grupo já ferido antes).
  const isCharacterGroup = key => key === "leader" || key === "support";
  let order = groups
    .map(g => g.key)
    .sort((a, b) => (isCharacterGroup(a) === isCharacterGroup(b) ? 0 : isCharacterGroup(a) ? 1 : -1));
  function draw() {
    wrap.innerHTML = "";
    order.forEach((key, i) => {
      const g = groups.find(gr => gr.key === key);
      const row = el("div", { class: "allocgroup" });
      row.appendChild(el("span", { text: (i + 1) + ". " + g.label + " (vivos: " + g.liveCount + ", W:" + g.stats.W + ")" }));
      const btns = el("div", { class: "row" }); btns.style.gap = "4px";
      const up = el("button", { class: "small", text: "↑" }); up.disabled = i === 0;
      up.onclick = () => { if (i > 0) { [order[i - 1], order[i]] = [order[i], order[i - 1]]; draw(); } };
      const down = el("button", { class: "small", text: "↓" }); down.disabled = i === order.length - 1;
      down.onclick = () => { if (i < order.length - 1) { [order[i], order[i + 1]] = [order[i + 1], order[i]]; draw(); } };
      btns.appendChild(up); btns.appendChild(down);
      row.appendChild(btns);
      wrap.appendChild(row);
    });
    const confirmBtn = el("button", { class: "primary", text: "Confirmar ordem →" });
    confirmBtn.style.width = "100%"; confirmBtn.style.marginTop = "8px";
    confirmBtn.onclick = () => onConfirm(order);
    wrap.appendChild(confirmBtn);
  }
  draw();
  return wrap;
}

loadStateFromLocalStorage();
render();

// PWA offline: regista o service worker depois de a página carregar, para
// não atrasar o primeiro render. Uma falha aqui (ex: a servir de file://
// sem servidor, onde service workers não correm) nunca deve impedir a app
// de funcionar normalmente — só perde-se a cache offline.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
