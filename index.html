<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>W40K Tracker — Armageddon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="W40K Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta — ver plano visual: cada cor tem papel de facção E semântico */
    --bg:#0d0e0c; --surface:#1a1b16; --surface2:#242619;
    --text:#e8e6de; --text-sec:#8f8f7f;
    --border:#3a3a32;
    --sm-red:#8a1518; --gold:#c9a227; --ork-green:#4a5522;
    --accent:var(--sm-red); --accent-text:var(--gold);
    --good:var(--ork-green); --warn:var(--gold); --danger:#b32a2a;
    --display-font:'Bebas Neue','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
    padding:12px;padding-bottom:60px;-webkit-font-smoothing:antialiased;
  }
  h1{font-family:var(--display-font);font-size:26px;margin:0 0 2px;text-align:center;letter-spacing:0.07em;text-transform:uppercase;}
  .subtitle{font-size:11px;color:var(--text-sec);text-align:center;margin-bottom:14px;}
  .devbanner{background:#2e2410;border:1px solid var(--gold);color:#e8c27a;font-size:11px;padding:8px 10px;border-radius:4px;margin-bottom:14px;line-height:1.4;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{
    flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;
    padding:10px 4px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:4px;
    font-family:var(--display-font);font-size:16px;letter-spacing:0.05em;color:var(--text-sec);cursor:pointer;text-transform:uppercase;
  }
  .tab.active{background:var(--sm-red);border-color:var(--sm-red);color:#fff;}
  .card{
    background:var(--surface);border-radius:4px;padding:14px;margin-bottom:12px;border:1px solid var(--border);
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 5px);
  }
  .card h2{
    font-family:var(--display-font);font-size:17px;margin:-14px -14px 12px;padding:9px 14px;
    color:#fff;background:var(--sm-red);text-transform:uppercase;letter-spacing:0.06em;border-radius:3px 3px 0 0;
  }
  .card h3{font-family:var(--display-font);font-size:16px;margin:0 0 8px;letter-spacing:0.04em;color:var(--gold);text-transform:uppercase;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  button{
    background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;
    padding:12px 14px;font-size:14px;cursor:pointer;min-height:48px;font-family:inherit;font-variant-numeric:tabular-nums;
  }
  button.primary{background:var(--sm-red);border-color:var(--sm-red);color:#fff;font-weight:600;}
  button.small{padding:8px 10px;font-size:12px;min-height:38px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  input[type=number],input[type=text],select,textarea{
    width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;
    padding:10px;font-size:15px;font-family:inherit;min-height:44px;font-variant-numeric:tabular-nums;
  }
  textarea{resize:vertical;min-height:50px;}
  label{font-family:var(--display-font);font-size:12px;letter-spacing:0.04em;color:var(--text-sec);display:block;margin-bottom:4px;text-transform:uppercase;}
  .field{margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
  .faction-badge{
    display:inline-block;font-size:11px;padding:4px 10px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);
    font-family:var(--display-font);letter-spacing:0.04em;text-transform:uppercase;
  }
  .faction-badge.sm{color:#fff;background:var(--sm-red);border-color:var(--sm-red);}
  .faction-badge.ork{color:#fff;background:var(--ork-green);border-color:var(--ork-green);}
  .unit-instance{background:var(--surface2);border-radius:4px;padding:10px;margin-bottom:6px;border-left:3px solid var(--border);}
  .unit-instance.sm{border-left-color:var(--sm-red);}
  .unit-instance.ork{border-left-color:var(--ork-green);}
  .unit-instance .row{margin-bottom:6px;}
  .player-card.sm{border-top:3px solid var(--sm-red);}
  .player-card.ork{border-top:3px solid var(--ork-green);}
  .ds-picker{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px;}
  .ds-item{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .ds-item:last-child{border-bottom:none;}
  .ds-item button{white-space:nowrap;}
  .ds-photo{width:80px;height:80px;border-radius:4px;object-fit:cover;background:var(--bg);border:2px solid var(--border);flex-shrink:0;}
  .ds-name-row{display:flex;align-items:center;gap:10px;flex-basis:100%;}
  .ds-name-row span{font-size:13px;line-height:1.35;}
  details{margin-bottom:8px;}
  summary{cursor:pointer;font-size:13px;padding:10px 8px;min-height:44px;display:flex;align-items:center;color:var(--text-sec);font-family:var(--display-font);letter-spacing:0.03em;text-transform:uppercase;}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;margin:6px 0;}
  .statbox{background:var(--bg);border-radius:4px;padding:6px;text-align:center;border:1px solid var(--border);}
  .statbox .v{font-size:16px;font-weight:700;color:var(--text);}
  .wpn{font-size:12px;color:var(--text-sec);padding:5px 0;border-top:1px dashed var(--border);}
  .wpn b{color:var(--text);}
  .kw{display:inline-block;background:var(--bg);color:var(--gold);border:1px solid var(--border);border-radius:3px;padding:2px 6px;font-size:9px;margin-left:3px;letter-spacing:0.03em;}
  .step-hint{font-size:12px;color:var(--text-sec);margin-bottom:8px;line-height:1.45;}
  .result{
    background:var(--sm-red);color:#fff;border-radius:4px;padding:16px;text-align:center;
    font-family:var(--display-font);font-size:22px;letter-spacing:0.03em;margin:10px 0;text-transform:uppercase;
  }
  .result.final{background:var(--ork-green);}
  .diegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px;}
  .diegrid button{padding:0;font-size:18px;font-weight:700;min-height:48px;font-family:var(--display-font);}
  .diegrid button.hit{background:var(--ork-green);border-color:var(--ork-green);color:#fff;}
  .tally{font-size:12px;color:var(--text-sec);margin-top:6px;}
  .toggle-mode{font-size:12px;color:var(--gold);text-decoration:underline;cursor:pointer;text-align:right;margin-top:6px;padding:6px 0;}
  .adjust-row{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;flex-wrap:wrap;}
  .adjust-row .step-hint{margin-bottom:0;}
  .adjust-control{display:inline-flex;align-items:center;gap:6px;}
  .adjust-control button{padding:2px 0;font-size:16px;font-weight:700;min-height:32px;width:32px;line-height:1;}
  .adjust-control .adjust-value{min-width:28px;text-align:center;font-family:var(--display-font);font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums;}
  .sticky-summary{position:sticky;top:0;z-index:5;background:var(--surface);padding:10px 14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);}
  .summary-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--text-sec);}
  .estado-divider{border-top:2px solid var(--border);margin:2px 0 14px;}
  .estado-unit-name{font-family:var(--display-font);font-size:15px;letter-spacing:0.03em;margin-bottom:6px;color:var(--text);}
  .estado-group-label{font-size:12px;color:var(--text-sec);}
  .estado-group-label.dead{text-decoration:line-through;}
  .unit-instance.dead{opacity:0.45;}
  .unit-instance.dead .estado-unit-name{text-decoration:line-through;}
  .roller-badge{border-radius:4px;padding:8px 10px;margin-bottom:10px;border-left:4px solid;}
  .roller-badge.attacker{background:rgba(179,42,42,0.15);border-left-color:var(--danger);}
  .roller-badge.defender{background:rgba(74,85,34,0.2);border-left-color:var(--ork-green);}
  .roller-who{font-family:var(--display-font);font-size:14px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text);}
  .roller-why{font-size:11px;color:var(--text-sec);margin-top:2px;}
  .voice-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .mic-btn{flex-shrink:0;width:48px;height:48px;min-height:48px;border-radius:50%;font-size:20px;padding:0;display:flex;align-items:center;justify-content:center;}
  .mic-btn.listening{background:var(--danger);border-color:var(--danger);color:#fff;animation:mic-pulse 1.1s ease-in-out infinite;}
  @keyframes mic-pulse{
    0%{box-shadow:0 0 0 0 rgba(179,42,42,0.6);}
    70%{box-shadow:0 0 0 14px rgba(179,42,42,0);}
    100%{box-shadow:0 0 0 0 rgba(179,42,42,0);}
  }
  .voice-status{font-size:12px;color:var(--text-sec);flex:1;}
  .voice-status.listening{color:var(--danger);font-weight:600;}
  .voice-review{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:10px;}
  .voice-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .voice-chip{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px;}
  .voice-chip.invalid{border-color:var(--danger);}
  .voice-chip .raw{font-size:10px;color:var(--text-sec);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .voice-chip input{width:52px;min-height:38px;padding:4px;text-align:center;}
  .voice-chip button{min-height:28px;padding:2px 6px;font-size:11px;}
  .allocgroup{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .empty{color:var(--text-sec);font-size:12px;text-align:center;padding:20px 0;}
  .filebtns{display:flex;gap:8px;}
  .filebtns > *{flex:1;}
  table{width:100%;font-size:13px;border-collapse:collapse;}
  td{padding:6px 0;border-top:1px solid var(--border);}
  /* --- Elemento assinatura: Phase Track (marcador físico de fase/ronda) --- */
  .round-dial{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
  .round-dial .num{font-family:var(--display-font);font-size:34px;color:var(--gold);letter-spacing:0.02em;line-height:1;}
  .round-pips{display:flex;gap:6px;}
  .round-pips .pip{width:11px;height:11px;border-radius:50%;background:var(--border);border:1px solid var(--border);}
  .round-pips .pip.done{background:var(--gold);border-color:var(--gold);}
  .phase-track{display:flex;gap:5px;margin-bottom:10px;}
  .phase-token{
    flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    clip-path:polygon(12% 0,100% 0,88% 100%,0% 100%);
    background:var(--surface2);color:var(--text-sec);border:none;padding:6px 2px;
    font-family:var(--display-font);font-size:11px;letter-spacing:0.03em;cursor:pointer;text-transform:uppercase;
  }
  .phase-token .n{font-size:15px;}
  .phase-token.current{background:var(--sm-red);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,0.45);transform:translateY(-3px);}
  .phase-token.done{
    background:var(--bg);color:var(--text-sec);
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 4px);
  }
</style>
</head>

// ---------------------------------------------------------------------------
// Normalização: cada datasheet passa a ter sempre um array `profiles`
// (grupos de alocação distintos). Só "Boyz" tem mais que um grupo.
// ---------------------------------------------------------------------------
function normalizeDatasheet(ds, faction) {
  let profiles;
  if (ds.multiProfile) {
    profiles = ds.multiProfile.map(p => ({ key: p.key, label: p.label, count: p.count, stats: Object.assign({}, p.stats) }));
  } else {
    profiles = [{ key: "main", label: ds.name, count: ds.defaultCount || 1, stats: Object.assign({}, ds.stats) }];
  }
  return Object.assign({}, ds, { faction, profiles });
}
function buildLibrary() {
  return {
    space_marines: RAW_UNITS.space_marines.map(d => normalizeDatasheet(d, "Space Marines")),
    orks: RAW_UNITS.orks.map(d => normalizeDatasheet(d, "Orks")),
  };
}
function allDatasheets(lib) { return lib.space_marines.concat(lib.orks); }
function findDatasheet(lib, name) { return allDatasheets(lib).find(d => d.name === name); }
function rangedWeaponsFor(instance) {
  const weapons = [];
  instance.datasheetNames.forEach(name => {
    const ds = findDatasheet(library, name);
    if (ds) ds.ranged_weapons.forEach(w => weapons.push(Object.assign({ sourceDatasheet: name }, w)));
  });
  return weapons;
}
function meleeWeaponsFor(instance) {
  const weapons = [];
  instance.datasheetNames.forEach(name => {
    const ds = findDatasheet(library, name);
    if (ds) ds.melee_weapons.forEach(w => weapons.push(Object.assign({ sourceDatasheet: name }, w)));
  });
  return weapons;
}
function weaponsForPhase(instance, phaseKey) {
  return phaseKey === "fight" ? meleeWeaponsFor(instance) : rangedWeaponsFor(instance);
}
function toHitValue(weapon, phaseKey) {
  return phaseKey === "fight" ? weapon.WS : weapon.BS;
}

// Tamanho ajustável de um esquadrão: perfis com count=1 (ex: Boss Nob) ficam
// sempre fixos a 1; o perfil "em massa" (count>1, ex: Boyz, Intercessors)
// escala com o campo de quantidade no picker. Datasheets sem perfil >1
// (characters solo, veículos) não são ajustáveis.
function squadSizing(ds) {
  const scalable = ds.profiles.find(p => p.count > 1) || null;
  const fixedTotal = ds.profiles.filter(p => p !== scalable).reduce((s, p) => s + p.count, 0);
  const defaultTotal = ds.profiles.reduce((s, p) => s + p.count, 0);
  return { scalable, fixedTotal, defaultTotal, adjustable: !!scalable };
}

// Input por voz (Web Speech API nativa, pt-PT) — alternativa aos contadores
// manuais de hits/wounds/saves falhados. Nunca aplica nada sem confirmação.
// ---------------------------------------------------------------------------
const PT_NUMBER_WORDS = {
  "zero": 0, "0": 0,
  "um": 1, "uma": 1, "1": 1,
  "dois": 2, "duas": 2, "2": 2,
  "tres": 3, "3": 3,
  "quatro": 4, "4": 4,
  "cinco": 5, "5": 5,
  "seis": 6, "6": 6,
  "sete": 7, "7": 7,
  "oito": 8, "8": 8,
  "nove": 9, "9": 9,
  "dez": 10, "10": 10,
};
function stripAccents(s) {
  const combiningMarks = new RegExp("[" + String.fromCharCode(768) + "-" + String.fromCharCode(879) + "]", "g");
  return s.normalize("NFD").replace(combiningMarks, "");
}
// Divide a frase reconhecida em números individuais (1-6 válidos; outros
// ficam marcados como inválidos em vez de serem descartados em silêncio).
function parseSpokenNumbers(transcript) {
  const tokens = stripAccents(transcript.toLowerCase())
    .split(/[\s,]+/)
    .map(t => t.trim())
    .filter(t => t.length > 0 && t !== "e");
  return tokens.map(raw => {
    const n = PT_NUMBER_WORDS[raw];
    const valid = n !== undefined && n >= 1 && n <= 6;
    return { raw, value: valid ? n : null, valid };
  });
}
function getSpeechRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

// ---------------------------------------------------------------------------
// Helpers de regras (core_rules_reference.md)
// ---------------------------------------------------------------------------
function parseThreshold(v) {
  if (v === undefined || v === null || v === "N/A") return null;
  if (typeof v === "number") return v;
  const m = String(v).match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function woundThreshold(s, t) {
  if (s >= t * 2) return 2;
  if (s > t) return 3;
  if (s === t) return 4;
  if (s * 2 <= t) return 6;
  return 5;
}
function parseDamage(d) {
  if (typeof d === "number") return { fixed: true, value: d };
  return { fixed: false, label: String(d) };
}
// Máximo fisicamente possível de um valor de dados tipo "D3", "D6", "D3+3".
// Para um número fixo devolve o próprio número. Usado para travar campos
// (hits/wounds/saves) num limite real em vez de deixar entrar qualquer valor.
function maxOfDiceNotation(v) {
  if (typeof v === "number") return v;
  const m = String(v).match(/^D(\d+)(?:\+(\d+))?$/i);
  if (!m) return null;
  return parseInt(m[1], 10) + (m[2] ? parseInt(m[2], 10) : 0);
}
function hasKeyword(weapon, kw) {
  return (weapon.keywords || []).some(k => k.toUpperCase().indexOf(kw.toUpperCase()) === 0);
}
// Lethal Hits condicional a ter carregado este turno é uma ability de
// UNIDADE (ex: Vanguard Assault), não uma keyword de arma — só se aplica a
// armas de combate (Fight Phase). Devolve o texto da ability (para mostrar
// tal e qual) ou null se não se aplicar.
function chargeLethalHitsAbility(weapon, phaseKey) {
  if (phaseKey !== "fight") return null;
  const ds = findDatasheet(library, weapon.sourceDatasheet);
  return (ds && ds.lethalHitsOnCharge) || null;
}
// Aplica um ajuste manual a um threshold base "precisas de X+". O valor
// introduzido representa o modificador ao ROLL (igual à notação do jogo:
// "-1 to hit" = adjust -1), por isso o threshold sobe quando o modificador é
// negativo (é mais difícil acertar) e desce quando é positivo — daí a
// subtração. Resultado travado entre 2 (o melhor possível) e 7 (sentinela de
// "auto-falha", mesma convenção já usada para saves > 6).
function adjustedThreshold(base, adjust) {
  if (base === null || base === undefined) return null;
  return Math.max(2, Math.min(7, base - (adjust || 0)));
}
function thresholdText(t) {
  return t > 6 ? "auto-falha" : (t + "+");
}
// Nome completo de uma estatística abreviada, para mostrar por extenso nos
// passos do ciclo de ataque em vez de só "S", "T", "SV"... Mantido em
// inglês (nome oficial da keyword no jogo), o resto da app fica em
// português — a abreviatura original fica sempre entre parêntesis também.
const STAT_FULL_NAMES = {
  M: "Movement", S: "Strength", T: "Toughness", SV: "Save",
  InvSV: "Invulnerable Save", W: "Wounds", LD: "Leadership",
  OC: "Objective Control", A: "Attacks", BS: "Ballistic Skill",
  WS: "Weapon Skill", AP: "Armour Penetration", D: "Damage",
};
function statLabel(abbr) {
  return (STAT_FULL_NAMES[abbr] || abbr) + " (" + abbr + ")";
}
// Indica sempre, de forma visível, QUEM fisicamente rola os dados neste
// passo (atacante ou defensor) e PORQUÊ (que tipo de roll é) — para nunca
// haver dúvida de quem deve estar com o dado na mão.
function renderRollerBadge(role, rollerName, why) {
  const wrap = el("div", { class: "roller-badge " + role });
  const label = role === "attacker" ? "⚔️ Rola o ATACANTE" : "🛡️ Rola o DEFENSOR";
  wrap.appendChild(el("div", { class: "roller-who", text: label + (rollerName ? " — " + rollerName : "") }));
  if (why) wrap.appendChild(el("div", { class: "roller-why", text: why }));
  return wrap;
}
// Extrai o número X de uma keyword do tipo "SUSTAINED HITS 1", "RAPID FIRE 2",
// "CLEAVE 1", "MELTA 2" (com ou sem "+" colado ao número). BLAST não leva
// número nas datasheets reais (é sempre "+1 attack por cada 5 modelos");
// se a keyword aparecer sem dígito nenhum, assume-se X=1.
function keywordValue(weapon, prefix) {
  const kw = (weapon.keywords || []).find(k => k.toUpperCase().indexOf(prefix.toUpperCase()) === 0);
  if (!kw) return null;
  const m = kw.match(/(\d+)\+?\s*$/);
  return m ? parseInt(m[1], 10) : 1;
}
// "ANTI-INFANTRY 4+" -> {targetKeyword:"INFANTRY", threshold:4}
function parseAntiKeyword(weapon) {
  const kw = (weapon.keywords || []).find(k => k.toUpperCase().indexOf("ANTI-") === 0);
  if (!kw) return null;
  const m = kw.match(/^ANTI-([A-Z\- ]+?)\s+(\d+)\+?$/i);
  if (!m) return null;
  return { targetKeyword: m[1].trim().toUpperCase(), threshold: parseInt(m[2], 10) };
}
// Keywords de TIPO de unidade (INFANTRY, VEHICLE, CHARACTER...) vêm do campo
// "keywords" da datasheet (não confundir com weapon.keywords) — usado só
// para confirmar automaticamente se ANTI-X se aplica a um alvo, nunca para
// decidir regras de combate.
function datasheetHasUnitKeyword(datasheetName, kw) {
  const ds = findDatasheet(library, datasheetName);
  if (!ds || !ds.keywords) return false;
  return ds.keywords.map(k => k.toUpperCase()).includes(kw.toUpperCase());
}
function targetHasUnitKeyword(target, kw) {
  return target.groups.some(g => datasheetHasUnitKeyword(g.datasheetName, kw));
}
// Feel No Pain é uma ability de UNIDADE (não de arma) — texto livre no campo
// "abilities" da datasheet, ex: "Dok's Toolz: Feel No Pain 5+". Procura em
// TODOS os grupos do alvo (um líder anexado como o Painboy propaga a
// ability à unidade toda enquanto estiver junto dela).
function findFeelNoPain(abilities) {
  if (!abilities) return null;
  for (const a of abilities) {

// ---------------------------------------------------------------------------
// Persistência local — sobrevive a fechar a página ou bloquear o telemóvel.
// Guarda-se sozinho a seguir a cada render(); carrega-se uma vez no arranque.
// ---------------------------------------------------------------------------
const LOCAL_STORAGE_KEY = "w40k_tracker_armageddon_state_v1";
function saveStateToLocalStorage() {
  try {
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
      setup: state.setup, game: state.game, tab: state.tab, uidCounter: uidCounter, attackLog: state.attackLog,
    }));
  } catch (e) { /* localStorage indisponível (ex: modo privado) — ignora silenciosamente */ }
}
function loadStateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.setup) Object.assign(state.setup, saved.setup);
    if (saved.game) Object.assign(state.game, saved.game);
    if (saved.tab) state.tab = saved.tab;
    if (saved.uidCounter) uidCounter = Math.max(uidCounter, saved.uidCounter);
    if (saved.attackLog) state.attackLog = saved.attackLog;
  } catch (e) { /* estado gravado corrompido/antigo — arranca do zero em vez de partir */ }
}

// "Novo jogo": limpa ronda/fase/CP/baixas/battle-shock, mas mantém os
// jogadores, as unidades escolhidas e o texto de missão (ver prompt original).
function startNewGame() {
  [state.setup.playerA, state.setup.playerB].forEach(player => {
    player.cp = 0;
    player.units.forEach(u => {
      u.battleshocked = false;
      u.groups.forEach(g => { g.liveCount = g.initialCount; });
    });
  });
  state.game = { round: 1, activePlayerKey: "playerA", phase: "command", ended: false, checklist: {}, battleshockRolls: {}, advanceRoll: { unitId: "", die: null }, chargeRoll: { unitId: "", dice: [] }, score: { playerA: [], playerB: [] }, actedByPhaseInstance: {}, usedWeaponsByUnit: {} };
  state.cycle = emptyCycle();
  state.attackLog = [];
}

function activePlayer() { return state.setup[state.game.activePlayerKey]; }
function activePlayerName() {

}
// Chave desta instância concreta de fase — usada para marcar unidades que
// já terminaram a ativação (Shooting/Fight). Recuar/Avançar dentro da MESMA
// instância mantém a marcação; uma nova ronda ou a próxima vez que este
// jogador chegar a esta fase é uma chave diferente, por isso começa limpa.
function phaseInstanceKey() {
  return state.game.round + "-" + state.game.activePlayerKey + "-" + state.game.phase;
}
function actedSetForCurrentPhase() {
  const key = phaseInstanceKey();
  if (!state.game.actedByPhaseInstance[key]) state.game.actedByPhaseInstance[key] = [];
  return state.game.actedByPhaseInstance[key];
}
function markUnitActedThisPhase(unitId) {
  const arr = actedSetForCurrentPhase();
  const idStr = String(unitId);
  if (!arr.includes(idStr)) arr.push(idStr);
}
// Cada arma dispara/luta uma vez por fase. Identifica-se por datasheet de
// origem + nome (não por índice, que pode variar consoante a lista de
// armas da unidade) e fica associada à ativação atual desta unidade nesta
// instância de fase — continuar com "outro ataque com esta unidade" não
// limpa isto, mas terminar a unidade ou uma nova instância de fase sim.
function weaponIdentity(weapon) {
  return (weapon.sourceDatasheet || "") + "|" + weapon.name;
}
function usedWeaponsSetFor(unitId) {
  const key = phaseInstanceKey() + "-" + unitId;
  if (!state.game.usedWeaponsByUnit[key]) state.game.usedWeaponsByUnit[key] = [];
  return state.game.usedWeaponsByUnit[key];
}
function markWeaponUsed(unitId, weapon) {
  const arr = usedWeaponsSetFor(unitId);
  const wid = weaponIdentity(weapon);
  if (!arr.includes(wid)) arr.push(wid);
}
function isWeaponUsed(unitId, weapon) {
  return usedWeaponsSetFor(unitId).includes(weaponIdentity(weapon));
}
function unitsOf(playerKey) {
  return state.setup[playerKey].units;
}
function totalLive(u) { return u.groups.reduce((s, g) => s + g.liveCount, 0); }
function totalInitial(u) { return u.groups.reduce((s, g) => s + g.initialCount, 0); }
function factionClass(faction) { return faction === "Space Marines" ? "sm" : faction === "Orks" ? "ork" : ""; }
function playerFactionLabel(player) {
  const factions = new Set(player.units.map(u => u.faction));
  if (factions.size === 0) return "—";
  if (factions.size === 1) return [...factions][0];
  return "Mista";
}
function playerTotals(player) {
  return player.units.reduce((acc, u) => {
    acc.live += totalLive(u);
    acc.initial += totalInitial(u);
    return acc;
  }, { live: 0, initial: 0 });
}
// Regista um ataque já resolvido no ciclo de combate — só para consulta na
// tab "Estado do Jogo" (mais recente primeiro), nunca lido de volta para
// cálculos. A app já tem toda esta informação disponível no momento em que
// o jogador confirma o resultado; só falta guardá-la em vez de descartar.
function logAttack(attacker, weapon, target, totalDead) {
  state.attackLog.unshift({
    round: state.game.round,
    attackerLabel: attacker.label,
    targetLabel: target.label,
    weaponName: weapon.name,
    dead: totalDead,
  });
}

function resetPhaseTransientState() {
  state.game.checklist[state.game.phase] = {};
  state.game.advanceRoll = { unitId: "", die: null };
  state.game.chargeRoll = { unitId: "", dice: [] };
  state.cycle = emptyCycle();
}

function advancePhase() {
  const idx = PHASES.findIndex(p => p.key === state.game.phase);
  if (idx < PHASES.length - 1) {
    state.game.phase = PHASES[idx + 1].key;
  } else if (state.game.activePlayerKey === "playerA") {
    state.game.activePlayerKey = "playerB";
    state.game.phase = "command";
  } else if (state.game.round < 5) {
    state.game.activePlayerKey = "playerA";
    state.game.phase = "command";
    state.game.round += 1;
  } else {
    state.game.ended = true;
  }
  resetPhaseTransientState();
}

function retreatPhase() {
  if (state.game.ended) {
    state.game.ended = false;
    resetPhaseTransientState();
    return;
  }
  const idx = PHASES.findIndex(p => p.key === state.game.phase);
  if (idx > 0) {
    state.game.phase = PHASES[idx - 1].key;
  } else if (state.game.activePlayerKey === "playerB") {
    state.game.activePlayerKey = "playerA";
    state.game.phase = "fight";
  } else if (state.game.round > 1) {
    state.game.activePlayerKey = "playerB";
    state.game.phase = "fight";
    state.game.round -= 1;
  } else {
    return; // já no início da batalha, nada antes disto
  }
  resetPhaseTransientState();
}

function renderEstadoPlayerSection(player, name, faction) {
  const card = el("div", { class: "card player-card " + factionClass(faction) });

  head.appendChild(el("h2", { text: name }));

  head.appendChild(el("span", { class: "faction-badge " + factionClass(faction), text: tot.live + "/" + tot.initial + " vivos" }));
  card.appendChild(head);

  if (player.units.length === 0) {
    card.appendChild(el("div", { class: "empty", text: "Nenhuma unidade configurada no Setup." }));
    return card;
  }

  player.units.forEach(u => {
    const isDead = totalLive(u) === 0;
    const ui = el("div", { class: "unit-instance " + factionClass(u.faction) + (isDead ? " dead" : "") });
    ui.appendChild(el("div", { class: "estado-unit-name", text: u.label }));
    u.groups.forEach(g => {
      const row = el("div", { class: "row" });
      row.style.marginBottom = "4px";
      const groupDead = g.liveCount === 0;
      row.appendChild(el("span", { class: "estado-group-label" + (groupDead ? " dead" : ""), text: u.groups.length > 1 ? g.label : "Modelos vivos" }));
      const right = el("div", { style: "display:flex;align-items:center;gap:6px;" });

      numIn.min = "0"; numIn.max = String(g.initialCount);
      numIn.oninput = e => { g.liveCount = Math.max(0, Math.min(g.initialCount, parseInt(e.target.value) || 0)); };
      numIn.onchange = () => render();
      right.appendChild(numIn);
      right.appendChild(el("span", { text: "/ " + g.initialCount + " vivos", style: "font-size:12px;color:var(--text-sec);white-space:nowrap;" }));
      row.appendChild(right);
      ui.appendChild(row);

    card.appendChild(ui);

  return card;
}

  }

function renderChecklist(phaseKey, items) {

function renderCommandPhase() {
  const wrap = el("div");
  const p = activePlayer();

  wrap.appendChild(renderStratagemsCard("command"));
  wrap.appendChild(renderChecklist("command", [
    "Ganhar 1 CP (ambos os jogadores)",
    "Testar battle-shock (unidades battle-shocked ou a metade força ou menos)",
    "Ativar habilidades de exército / comando",
    "Marcar pontos primários (a partir da ronda 2)",
  ]));

  const bsCard = el("div", { class: "card" });
  bsCard.appendChild(el("h2", { text: "Battle-shock — " + activePlayerName() }));
  const needsTest = p.units.filter(u => u.battleshocked || totalLive(u) * 2 <= totalInitial(u));
  if (needsTest.length === 0) {
    bsCard.appendChild(el("div", { class: "empty", text: "Nenhuma unidade precisa de testar (todas acima de metade força e não battle-shocked)." }));
  }
  needsTest.forEach(u => {
    const repGroup = u.groups.reduce((best, g) => (g.liveCount > (best ? best.liveCount : -1) ? g : best), null);
    const ld = parseThreshold(repGroup ? repGroup.stats.LD : null) || 7;
    const row = el("div", { class: "unit-instance" });
    row.appendChild(el("div", { text: u.label + " — " + totalLive(u) + "/" + totalInitial(u) + " modelos" + (u.battleshocked ? " (já battle-shocked)" : ""), style: "font-size:13px;margin-bottom:6px;" }));
    row.appendChild(el("div", { class: "step-hint", text: "LD usada: " + (repGroup ? repGroup.stats.LD : "?") + " (grupo " + (repGroup ? repGroup.label : "?") + "). Rola 2D6 — precisas de " + ld + "+ para passar." }));
    const rollKey = String(u.id);
    const val = state.game.battleshockRolls[rollKey] || 0;
    const inp = el("input", { type: "number" });
    inp.value = val; inp.min = "2"; inp.max = "12";
    inp.oninput = e => { state.game.battleshockRolls[rollKey] = Math.max(0, parseInt(e.target.value) || 0); };
    row.appendChild(inp);
    const btn = el("button", { class: "primary", text: "Confirmar resultado" });
    btn.style.cssText = "width:100%;margin-top:6px;";
    btn.onclick = () => {
      const roll = state.game.battleshockRolls[rollKey] || 0;
      u.battleshocked = roll < ld;
      delete state.game.battleshockRolls[rollKey];
      render();
    };
    row.appendChild(btn);
    bsCard.appendChild(row);
  });
  wrap.appendChild(bsCard);

  return wrap;
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state.setup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "w40k_setup.json"; a.click();
  URL.revokeObjectURL(url);
}
function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      state.setup = JSON.parse(reader.result);
      state.ui.importError = null;
      render();
    } catch (err) {
      // Nunca usar window.alert() aqui — mesma razão do confirm() do "Novo
      // jogo": pode falhar silenciosamente em PWA instalada.
      state.ui.importError = "JSON inválido: " + err.message;
      render();
    }
  };
  reader.readAsText(file);
}

  );

function supportersFor(ds) {

  );

function addUnitToPlayer(playerKey, ds, opts) {
  opts = opts || {};
  const player = state.setup[playerKey];
  const leaderDs = opts.leaderDs || null;
  const supportDs = opts.supportDs || null;
  const sizing = squadSizing(ds);
  const requestedCount = (sizing.adjustable && opts.count != null) ? Math.max(sizing.fixedTotal + 1, opts.count) : null;
  const count = requestedCount != null ? Math.min(requestedCount, Math.max(0, remainingCount(ds))) : null;
  const neededTotal = count != null ? count : sizing.defaultTotal;
  if (neededTotal <= 0 || remainingCount(ds) < neededTotal || (leaderDs && remainingCount(leaderDs) <= 0) || (supportDs && remainingCount(supportDs) <= 0)) return;

  const groups = [];
  if (leaderDs) {
    groups.push({ key: "leader", label: leaderDs.name, datasheetName: leaderDs.name, stats: Object.assign({}, leaderDs.profiles[0].stats), liveCount: 1, initialCount: 1 });
  }
  if (supportDs) {
    groups.push({ key: "support", label: supportDs.name, datasheetName: supportDs.name, stats: Object.assign({}, supportDs.profiles[0].stats), liveCount: 1, initialCount: 1 });
  }
  ds.profiles.forEach(p => {
    let liveCount = p.count;
    if (count != null && p === sizing.scalable) liveCount = count - sizing.fixedTotal;
    groups.push({ key: p.key, label: p.label, datasheetName: ds.name, stats: Object.assign({}, p.stats), liveCount, initialCount: liveCount });
  });

  const datasheetNames = [leaderDs, supportDs, ds].filter(Boolean).map(d => d.name);
  let baseLabel = [leaderDs, supportDs, ds].filter(Boolean).map(d => d.name).join(" + ");
  const customCount = count != null && count !== sizing.defaultTotal;
  if (customCount) baseLabel += " (" + count + ")";

  const dedupeKey = datasheetNames.join("|");
  const existing = player.units.filter(u => u.datasheetNames.join("|") === dedupeKey).length;
  const isSquadLike = leaderDs != null || supportDs != null || sizing.defaultTotal > 1;
  const needsNumber = existing > 0 || isSquadLike;

  const points = (leaderDs ? leaderDs.points : 0) + (supportDs ? supportDs.points : 0) + ds.points;

  const inst = {
    id: nextId(),
    datasheetNames,
    faction: ds.faction,
    label: baseLabel + (needsNumber ? " #" + (existing + 1) : ""),
    points,
    pointsApprox: customCount,
    battleshocked: false,
    groups,
  };
  player.units.push(inst);
}
